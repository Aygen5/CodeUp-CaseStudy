    <!-- Intercept sandbox default demo apps configuration request to suppress 'Sample Applications' -->
    <script>
        (function () {
            var origOpen = window.XMLHttpRequest.prototype.open;
            var origSend = window.XMLHttpRequest.prototype.send;
            window.XMLHttpRequest.prototype.open = function (method, url) {
                this._interceptUrl = url;
                return origOpen.apply(this, arguments);
            };
            window.XMLHttpRequest.prototype.send = function () {
                if (this._interceptUrl && typeof this._interceptUrl === "string" && this._interceptUrl.indexOf("shells/sandbox/fioriSandboxConfig.json") !== -1) {
                    var emptyMock = JSON.stringify({
                        services: {
                            ClientSideTargetResolution: {
                                adapter: {
                                    config: {
                                        inbounds: {}
                                    }
                                }
                            }
                        }
                    });
                    Object.defineProperty(this, "status", { get: function () { return 200; }, configurable: true });
                    Object.defineProperty(this, "statusText", { get: function () { return "OK"; }, configurable: true });
                    Object.defineProperty(this, "readyState", { get: function () { return 4; }, configurable: true });
                    Object.defineProperty(this, "responseText", { get: function () { return emptyMock; }, configurable: true });
                    Object.defineProperty(this, "response", { get: function () { return emptyMock; }, configurable: true });
                    if (typeof this.onreadystatechange === "function") {
                        this.onreadystatechange();
                    }
                    if (typeof this.onload === "function") {
                        this.onload();
                    }
                    return;
                }
                return origSend.apply(this, arguments);
            };
        })();
    </script>
    <script id="sap-ushell-bootstrap" src="https://ui5.sap.com/test-resources/sap/ushell/bootstrap/sandbox.js"></script>

        data-sap-ui-compatVersion="edge"
        data-sap-ui-async="true"
        data-sap-ui-frameOptions="allow">
    </script>
    <script>
        sap.ui.getCore().attachInit(function () {
            // Function to apply user identity to SAPUI5 Shell UserInfo
            function applyUserToShell(user) {
                if (user && sap.ushell && sap.ushell.Container) {
                    sap.ushell.Container.getServiceAsync("UserInfo").then(function (userInfoService) {
                        var oUser = userInfoService.getUser();
                        if (oUser) {
                            var displayName = user.displayName || 'Aygen Yıldırım';
                            var firstName = user.firstname || displayName.split(' ')[0] || 'Aygen';
                            var lastName = user.lastname || displayName.split(' ').slice(1).join(' ') || 'Yıldırım';
                            var email = user.email || 'aygenyildirim27@gmail.com';
                            oUser.setFullName(displayName);
                            oUser.setFirstName(firstName);
                            oUser.setLastName(lastName);
                            oUser.setEmail(email);
                            if (user.name) oUser.setId(user.name);
                        }
                    }).catch(function () {});
                }
            }

            // Register custom logout hook to redirect to Approuter's /logout route
            sap.ushell.Container.registerLogout(function () {
                window.location.href = '/logout';
            });

            fetch('/user-api/currentUser')
                .then(function (res) { return res.ok ? res.json() : null; })
                .then(function (user) {
                    if (user) {
                        applyUserToShell(user);
                    }
                })
                .catch(function () {})
                .finally(function () {
                    // Create renderer asynchronously with bAsync: true
                    sap.ushell.Container.createRenderer(true).then(function (oRenderer) {
                        oRenderer.placeAt("canvas");
                    });
                });
        });
    </script>
